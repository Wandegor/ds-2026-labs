version: '3.9'

services:
  redis:
    image: redis:latest
    container_name: valuator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: valuator-rabbitmq
    ports:
      - "5672:5672"  
      - "15672:15672" # Порт для браузера (админка)
    networks:
      - app-network

  rank-calculator:
    build:
      context: ./RankCalculator
      dockerfile: Dockerfile
    container_name: valuator-rank-calc
    depends_on:
      - redis
      - rabbitmq
    environment:
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
    networks:
      - app-network

  app1:
    build:
      context: .
      dockerfile: Valuator/Dockerfile
    container_name: valuator-app1
    depends_on:
      - redis
      - rabbitmq
    environment:
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq 
    ports:
      - "5001:8080"
    networks:
      - app-network

  app2:
    build:
      context: .
      dockerfile: Valuator/Dockerfile
    container_name: valuator-app2
    depends_on:
      - redis
      - rabbitmq
    environment:
      - ConnectionStrings__Redis=redis:6379
      - RabbitMQ__Host=rabbitmq
    ports:
      - "5002:8080"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: valuator-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data: